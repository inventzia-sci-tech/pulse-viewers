name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  # pulse-viewers depends on nothing of ours: it reads a run's artifacts as plain JSON, so there is
  # no sibling checkout, no JVM and no pulse-data install. Only Python and Qt.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PySide6 needs these X/GL libraries present even under the offscreen platform plugin;
      # without them `import PySide6.QtWidgets` fails on a bare runner.
      - name: System libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest

      # QT_QPA_PLATFORM is also set in conftest.py, so the suite is runnable locally without it;
      # setting it here too makes the intent explicit in the job log.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  # The distribution is what users actually get: build it, install it into a clean environment with
  # no source tree in sight, and prove the console entry point and packaged schema both work.
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: System libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl

      # Run from a directory with no source tree, so an accidental source-path dependency fails
      # here rather than in a user's install.
      - name: Smoke test the installed artifact
        env:
          QT_QPA_PLATFORM: offscreen
        working-directory: /tmp
        run: |
          /tmp/venv/bin/python -c "
          from inventzia.pulse.viewers import event_viewer, run_browser, live_tail
          from inventzia.pulse.viewers.contract import event_record, run_layout
          import inventzia.pulse.viewers as v

          # The schema must be packaged, not read from a source path.
          schema = event_record.load_schema()
          assert set(schema['\$defs']) >= {'header', 'event', 'trailer'}, schema.keys()

          # A recording round-trips through the installed reader.
          import tempfile, pathlib
          out = pathlib.Path(tempfile.mkdtemp()) / 'sample.jsonl'
          event_record.make_sample(out, events=25)
          report = event_record.validate(out)
          assert report.ok and report.event_count == 25, (report.ok, report.diagnostics)

          # And the GUI classes import and construct headless.
          from PySide6.QtWidgets import QApplication
          app = QApplication([])
          win = event_viewer.MainWindow(str(out), None, None)
          assert win.model.rowCount() == 25
          print('pulse-viewers', v.__version__, 'installed artifact OK')
          "

      # --help is the only invocation that returns rather than opening a window, so it is the one
      # way to prove the entry point actually resolves and runs.
      - name: Console entry point resolves and runs
        working-directory: /tmp
        run: |
          test -x /tmp/venv/bin/pulse-events-viewer
          /tmp/venv/bin/pulse-events-viewer --help

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
