name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  # pulse-viewers depends on nothing of ours: it reads a run's artifacts as plain JSON, so there is
  # no sibling checkout, no JVM and no pulse-data install. Only Python and Qt.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PySide6 needs these X/GL libraries present even under the offscreen platform plugin;
      # without them `import PySide6.QtWidgets` fails on a bare runner.
      - name: System libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest

      # QT_QPA_PLATFORM is also set in conftest.py, so the suite is runnable locally without it;
      # setting it here too makes the intent explicit in the job log.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  # The distribution is what users actually get: build it, install it into a clean environment with
  # no source tree in sight, and prove the console entry point and packaged schema both work.
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: System libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Version consistency (dev mode)
        run: bash check-versions.sh

      # The same scripts a maintainer runs locally, so CI cannot drift from the release procedure.
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Distribution smoke test (installed wheel, no source tree)
        run: bash dist-smoke-test.sh

      - name: PyPI long description renders
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  # On a vX.Y.Z tag: prove the tag, the package version and the changelog agree, then build and
  # verify the artifacts. Publishing stays a separate credentialed step (see RELEASING.md).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, dist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, so `git describe --exact-match` can see the tag it is verifying.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: System libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Validate immutable release inputs
        run: |
          test "$(git describe --tags --exact-match)" = "$GITHUB_REF_NAME"
          bash check-versions.sh --release --tag "$GITHUB_REF_NAME"

      - name: Release build (build + smoke test the installed wheel)
        run: bash release-build.sh --tag "$GITHUB_REF_NAME"

      - name: Record the resolved commit
        run: |
          {
            echo "tag=$GITHUB_REF_NAME"
            echo "pulse-viewers=$(git rev-parse HEAD)"
          } > dist/release-inputs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/release-inputs.txt
